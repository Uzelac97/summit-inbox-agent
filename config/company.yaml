# Business facts for the inbox agent.
#
# This is the ONLY file a new business edits. Nothing company-specific lives in
# the prompt, the code, or the eval set. The agent answers customer questions
# from this file and nothing else: if a fact is not here, the draft must not
# assert it.
#
# Editing this file changes the prompt fingerprint, which retires every cached
# analysis - deliberately, since the answers change with it.
#
# Phone numbers below are placeholders. Replace them before real use.

name: Summit Roofing
tagline: Residential and commercial roofing

# The company's own language, as an ISO code. Used when reply_language is
# "company", and as the fallback when a customer's language cannot be told.
language: en

# How the draft reply picks its language:
#   match_customer - reply in whatever language the customer wrote in (default)
#   company        - always reply in the language set above
#   a code such as "de" - always reply in that language
reply_language: match_customer

# Used only if the business ever quotes figures. The agent never states prices,
# so this exists for completeness and for any later feature that needs it.
currency: EUR

contact:
  phone: "+1 555 0199"
  emergency_phone: "+1 555 0199"
  email: summit.roofing.demo11@gmail.com

services:
  - Full roof replacement, asphalt shingle and architectural shingle
  - Roof repairs, including leaks, storm damage, and missing or damaged shingles
  - Flat and low-slope roofing, including EPDM and TPO
  - Roof inspections and condition reports
  - Gutter cleaning, repair, and replacement
  - Chimney and skylight flashing
  - Soffit and fascia repair
  - Emergency temporary weatherproofing, including tarping

not_offered:
  - Solar panel supply or installation
  - Interior repairs, plastering, or redecoration after a leak
  - Tree cutting or removal

# Leave this empty to serve customers anywhere. When empty the agent never
# declines work on location grounds and never mentions geography at all.
# To restrict coverage, give a description and optionally a list of areas:
#
# service_area:
#   description: Greater Manchester and within about 30 miles
#   areas:
#     - Manchester
#     - Salford
service_area: {}

hours:
  weekdays: Monday to Friday, 7:00 to 17:00
  saturday: Saturday, 8:00 to 12:00, inspections only
  sunday: Closed
  emergency: Emergency call-outs are available 24 hours a day, 7 days a week

response_times:
  quote: Quotes are sent within 24 hours of a site visit or of receiving full details
  inspection_report: Inspection reports are sent within 2 working days
  emergency: Emergency calls are answered 24/7 on the emergency line

warranty:
  workmanship: Workmanship warranty is provided in writing with every completed job
  note: >-
    Warranty length and transferability vary by job and by manufacturer, so
    never quote a specific number of years. Offer to send the written warranty
    documentation for the customer's own job instead.

payment:
  note: >-
    Never quote a price, a rate, or a deposit amount. Pricing always follows a
    site visit.
